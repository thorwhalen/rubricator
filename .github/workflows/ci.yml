name: CI

on:
  push:
    branches: [main]
  pull_request:

# No publish job yet, deliberately. The ecosystem convention for a
# wads-managed package is the reusable workflow at i2mint/wads
# (.github/workflows/uv-ci.yml), which publishes to PyPI on merge. Adopt it when
# this package is ready to release and PYPI_PASSWORD is set on the repo -- until
# then it would fail red on every push, which teaches people to ignore CI.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # No extras. The tool layer must be importable and testable in a bare
        # environment -- that is the property the connector runtime depends on,
        # and installing [all] here would hide a regression in it.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Tests and doctests
        run: pytest -q

  determinism:
    # Split into its own job so that a failure here is unmistakable in the
    # checks list. This is the one architectural rule of the project (ADR-0003):
    # tools are deterministic, the loop is not. If it fails, the fix is to split
    # the step into a prompt plus a validating tool -- never to relax the test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: The tool layer calls no model, and is reproducible
        run: pytest tests/test_determinism_boundary.py -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No NUL bytes in tracked files
        # This step guards the two below it, and it exists because the same two
        # steps in the companion repository silently failed to guard anything.
        #
        # Both use `grep -rI`, where -I means "skip binary files", and grep
        # calls a file binary the moment it contains a NUL byte. That repo's
        # principal export carried two literal NUL characters in a template
        # literal, so it was skipped by the absolute-path scan AND by the
        # ADR-0016 denylist -- a hard constraint -- while both steps reported
        # success. Nothing here has one today; this keeps it that way.
        #
        # Dropping -I is not the fix: the scans would then read real binaries
        # and emit noise. The fix is that nothing goes binary silently. The
        # allowlist is empty on purpose -- committing a binary should be a
        # deliberate edit here, not a file that quietly stops being scanned.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys

          ALLOW: set[str] = set()   # deliberately empty; see the comment above

          files = subprocess.run(
              ['git', 'ls-files', '-z'], capture_output=True, check=True
          ).stdout.split(b'\0')

          offenders = []
          for raw in files:
              if not raw:
                  continue
              name = raw.decode('utf-8', 'surrogateescape')
              if name in ALLOW:
                  continue
              try:
                  with open(raw, 'rb') as fh:
                      if b'\0' in fh.read():
                          offenders.append(name)
              except (IsADirectoryError, FileNotFoundError):
                  # A tracked symlink to a directory, e.g. the .claude/skills
                  # bridge. Not a file, nothing to scan.
                  pass

          if offenders:
              print('::error::NUL byte in a tracked file. `grep -I` skips it, so the '
                    'absolute-path scan and the ADR-0016 denylist below would pass '
                    'without ever reading it.')
              print('::error::In source, write the \\u0000 escape instead of a literal NUL.')
              for o in offenders:
                  print(f'  {o}')
              sys.exit(1)

          print(f'no NUL bytes in {sum(1 for f in files if f)} tracked files; '
                'the scans below can read everything')
          PY

      - name: No absolute local paths or personal identifiers
        run: |
          set -euo pipefail
          if grep -rIn -E '/Users/[a-z]|/home/[a-z]|/root/[a-z]' \
               --exclude-dir=.git . ; then
            echo "::error::absolute local path found; see CLAUDE.md on public-repo hygiene"
            exit 1
          fi
          echo "no absolute local paths anywhere in the tree"

      - name: Pre-publish denylist
        # Mirrors the companion repo's ADR-0016 check. The denylist names terms
        # from the private analysis this originated in, so the file itself must
        # never be committed; it is supplied out of band as a secret. Absent
        # secret => skipped loudly, because a hygiene check that quietly does
        # nothing is worse than no check.
        env:
          DENYLIST: ${{ secrets.ADR_0016_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST:-}" ]; then
            echo "::warning::ADR_0016_DENYLIST secret is not set; the pre-publish check did NOT run."
            exit 0
          fi
          printf '%s\n' "$DENYLIST" | grep -v '^[[:space:]]*$' > /tmp/denylist.txt
          if grep -rIinf /tmp/denylist.txt --exclude-dir=.git . ; then
            echo "::error::denylisted term found; this is a hard constraint, not a preference."
            exit 1
          fi
          echo "denylist clean ($(wc -l < /tmp/denylist.txt) terms checked)"
