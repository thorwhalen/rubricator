name: Schema drift

# Warn-only comparison of the vendored comparanda schema set with the companion's
# published versions (#127). It never fails a build: a red X because someone else
# released is a coordination tax with no safety benefit.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/check_schema_drift.py
